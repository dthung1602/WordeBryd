    <script src="resources/libv86.js"></script>
    <script>
        "use strict";
        window.onload = function () {
            // toggleCredit();
            // return;
            const emulator = new V86({
                wasm_path: "./resources/v86.wasm",
                memory_size: 512 * 1024 * 1024, // 512 MB
                vga_memory_size: 32 * 1024 * 1024, // 32 MB
                screen_container: document.getElementById("screen_container"),
                disable_speaker: false,
                initial_state: {
                    url: "./resources/machine-state.bin.zst"
                },
                bios: {
                    url: "./resources/seabios.bin",
                },
                vga_bios: {
                    url: "./resources/vgabios.bin",
                },
                hda: {
                    url: "./resources/windows2000/windows.img.zst",
                    async: true,
                    use_parts: true,
                    fixed_chunk_size: 256 * 1024,
                    size: 2147483648
                },
                cdrom: {
                    url: "./resources/wordbird.iso.zst",
                    async: false
                },
                autostart: true,
            });

            document.body.addEventListener("click", function () {
                const ctx = emulator.speaker_adapter && emulator.speaker_adapter.audio_context;
                if (emulator.is_running() && ctx && ctx.state === "suspended") {
                    ctx.resume();
                }
            });

            const canvas = document.querySelector("#screen_container canvas")
            canvas.addEventListener("click", async () => {
                if (!document.pointerLockElement) {
                    await canvas.requestPointerLock({
                        unadjustedMovement: true,
                    });
                }
            });

            // document.getElementById("save_file").onclick = async function()
            // {
            //     const new_state = await emulator.save_state();
            //     const a = document.createElement("a");
            //     a.download = "v86state.bin";
            //     a.href = window.URL.createObjectURL(new Blob([new_state]));
            //     a.dataset.downloadurl = "application/octet-stream:" + a.download + ":" + a.href;
            //     a.click();
            //
            //     this.blur();
            // };
        };

        let isCreditShow = false;

        function toggleCredit() {
            if (isCreditShow) {
                document.getElementById("credit").style.display = "none";
                document.getElementById("screen_container").style.display = "flex";
            } else {
                document.getElementById("credit").style.display = "block";
                document.getElementById("screen_container").style.display = "none";
            }
            isCreditShow = !isCreditShow;
        }
    </script>
    <style>
        body {
            margin: 0;
            background: #659f87;
        }

        #screen_container {
            display: flex;
            justify-content: center;
            width: 800px;
            height: 600px;
            /*outline: 1px solid red;*/
            white-space: pre;
            font: 14px monospace;
            line-height: 14px;

        #credit {
            display: none;
            /*outline: 1px solid purple;*/
            width: 800px;
            height: 600px;
            background: #2d2d2d;
            color: white;
            padding: 100px;
            font-family: "Courier New", Courier, monospace;
            font-size: 16px;
        }

        #credit a {
            color: lightgray;
        }

        #screen_container > div div {
            display: none;
        }

        #screen_container canvas {
            width: 800px !important;
            height: 600px !important;
        }

        #container {
            position: absolute;
            display: block;
            width: 800px;
            height: 600px;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            /*outline: 2px solid greenyellow;*/
            border-radius: 12px;
            overflow: hidden;
        }

        #background {
            position: relative;
            /*outline: 1px solid blue;*/
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #background img {
            display: block;
            transform: translateY(-2px);
        }

        #btn {
            position: absolute;
            display: block;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            /*outline: 1px solid red;*/
            transform: translate(2px, 674px);
            z-index: 9999;
        }

        #btn:hover {
